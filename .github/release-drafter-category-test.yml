# Test-only config. Exact copy of the canonical design's 4-category list
# (no catch-all category), to observe how release-drafter renders a merged
# PR that has no label matching any of them. dry-run: true so nothing gets
# written back to the real draft release this time.
name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels: ['feature']
  - title: '🐛 Bug Fixes'
    labels: ['fix']
  - title: '🧰 Maintenance'
    labels: ['maintenance']
  - title: '📦 Dependencies'
    labels: ['dependencies']

change-template: '- $TITLE (#$NUMBER, @$AUTHOR)'
change-title-escapes: '\<*_&'
commitish: 'main'

template: |
  ## Changes since $PREVIOUS_TAG

  $CHANGES
