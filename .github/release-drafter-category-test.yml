name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels: ['feature']
    exclusive: true
  - title: '🐛 Bug Fixes'
    labels: ['fix']
  - title: '🧰 Maintenance'
    labels: ['maintenance']
  - title: '📦 Dependencies'
    labels: ['dependencies']

change-template: '- $TITLE (#$NUMBER, @$AUTHOR)'
change-title-escapes: '\<*_&'
commitish: 'main'

template: |
  ## Changes since $PREVIOUS_TAG

  $CHANGES
