name: Test PR with both bug and feature labels (SWPBL-268375)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run release-drafter (dry-run)
        id: rd
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          config-name: release-drafter-both-labels-test.yml
          dry-run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print rendered body
        run: |
          echo "----- BODY START -----"
          cat << 'BODYEOF'
          ${{ steps.rd.outputs.body }}
          BODYEOF
          echo "----- BODY END -----"
