name: Test check-newer script (temporary)

on:
  workflow_dispatch:
    inputs:
      tag-prefix:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a newer tag already published
        id: check-newer
        uses: actions/github-script@v7
        env:
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          CURRENT_VERSION: ${{ inputs.version }}
        with:
          script: |
            const prefix = process.env.TAG_PREFIX;
            const current = process.env.CURRENT_VERSION;
            // Tags ordered by commit date, newest first, so old tags that merely sort higher
            // (e.g. 999.x) can't win. The query matches anywhere in the name; filter on prefix.
            const { repository } = await github.graphql(
              `query($owner: String!, $name: String!, $q: String!) {
                repository(owner: $owner, name: $name) {
                  refs(refPrefix: "refs/tags/", query: $q, first: 50,
                       orderBy: {field: TAG_COMMIT_DATE, direction: DESC}) {
                    nodes { name }
                  }
                }
              }`,
              { owner: context.repo.owner, name: context.repo.repo, q: prefix },
            );
            const tags = repository.refs.nodes.map((n) => n.name).filter((n) => n.startsWith(prefix));
            const idx = tags.indexOf(`${prefix}${current}`);
            core.setOutput("value", idx > 0 ? tags[0].slice(prefix.length) : "");
      - name: Show result
        run: echo "newer-version=[${{ steps.check-newer.outputs.value }}]"
