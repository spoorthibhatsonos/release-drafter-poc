name: Test check-newer script (temporary)

on:
  workflow_dispatch:
    inputs:
      tag-prefix:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        id: check-newer
        uses: actions/github-script@v7
        env:
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          CURRENT_VERSION: ${{ inputs.version }}
        with:
          script: |
            const prefix = process.env.TAG_PREFIX;
            const current = process.env.CURRENT_VERSION;
            // Newest commit first, so old tags that merely sort higher (e.g. 999.x) can't win.
            // The query matches anywhere in the name, so filter on prefix.
            const { repository } = await github.graphql(
              `query($owner: String!, $name: String!, $q: String!) {
                repository(owner: $owner, name: $name) {
                  refs(refPrefix: "refs/tags/", query: $q, first: 100,
                       orderBy: {field: TAG_COMMIT_DATE, direction: DESC}) {
                    nodes { name }
                  }
                }
              }`,
              { owner: context.repo.owner, name: context.repo.repo, q: prefix },
            );
            const newest = repository.refs.nodes.map((n) => n.name).find((n) => n.startsWith(prefix));
            core.setOutput("value", newest && newest !== `${prefix}${current}` ? newest.slice(prefix.length) : "");
      - run: echo "newer-version=[${{ steps.check-newer.outputs.value }}]"
