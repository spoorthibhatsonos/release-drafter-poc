name: Test release-draft.yml's Update draft release step

# Copies workflow.yml's "Update draft release" step verbatim, minus read-repo-metadata
# itself -- that needs sonos-inc/platform-core access, which we confirmed a personal repo
# can't reach via uses: (separate, already-settled test). `name:` is still exercised below,
# with "Cloud Settings" hardcoded in place of read-repo-metadata's service-friendly-name
# output, so the name-templating path doesn't go untested just because its real input
# source is unreachable here.
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      commitish:
        required: false
        type: string
        default: "main"

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Update draft release
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          config-name: release-draft-under-test.yml
          version: ${{ inputs.version }}
          tag: ${{ inputs.version }}
          name: "Cloud Settings ${{ inputs.version }}"
          commitish: ${{ inputs.commitish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
