name: Argo Regional Prod Deploy (vendored for SWPBL-268373 testing)

# Adapted from platform-core's workflows/argo-regional-prod-deploy/workflow.yml:
# - deploy calls dummy-argo-deploy-test-java.yml instead of the real argo-deploy-test-java.
# - pin-draft/redraft-if-newer call the local vendored release-draft.yml.
# - finalize uses the local vendored promote-release-to-latest / update-region-rollout-status
#   actions, with the ambient GITHUB_TOKEN instead of a minted GitHub App token (no App
#   installed in this POC).
# - provenance-gate uses the local check-provenance action against this repo's own history.
# Everything else -- the first-to-succeed publish decision (check-already-published alone),
# the finalize verify step, the needs.*.result wiring -- is unchanged from the real
# workflow. That's what's under test.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      sha:
        type: string
        required: true
      region:
        type: string
        required: true
      tag-prefix:
        type: string
        required: false
        default: ""
      should-fail:
        type: boolean
        required: false
        default: false
    outputs:
      deploy-final-state:
        value: ${{ jobs.deploy.outputs.final-state }}

permissions:
  contents: write

jobs:
  provenance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-provenance
        with:
          sha: ${{ inputs.sha }}

  deploy:
    needs: [provenance-gate]
    uses: ./.github/workflows/dummy-argo-deploy-test-java.yml
    with:
      region: ${{ inputs.region }}
      version: ${{ inputs.version }}
      sha: ${{ inputs.sha }}
      should-fail: ${{ inputs.should-fail }}

  check-already-published:
    needs: [deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.check.outputs.value }}
    steps:
      - name: Check whether this tag is already published
        id: check
        uses: actions/github-script@v7
        env:
          TAG: ${{ inputs.tag-prefix }}${{ inputs.version }}
        with:
          script: |
            const tag = process.env.TAG;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setOutput("value", data.draft ? "false" : "true");
            } catch (err) {
              if (err.status === 404) {
                core.setOutput("value", "false");
              } else {
                throw err;
              }
            }

  pin-draft:
    needs: [deploy, check-already-published]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.check-already-published.outputs.value == 'false' }}
    uses: ./.github/workflows/release-draft.yml
    with:
      version: ${{ inputs.tag-prefix }}${{ inputs.version }}
      commitish: ${{ inputs.sha }}

  finalize:
    needs: [deploy, pin-draft]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      newer-version: ${{ steps.check-newer.outputs.value }}
    steps:
      # Local (./) actions need the repo checked out first -- unlike the real design's
      # cross-repo action refs, which GitHub Actions downloads independently of checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the release still points at the deployed sha
        if: ${{ needs.pin-draft.result == 'success' }}
        uses: actions/github-script@v7
        env:
          TAG: ${{ inputs.tag-prefix }}${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.sha }}
        with:
          script: |
            const tag = process.env.TAG;
            const expected = process.env.EXPECTED_SHA;
            const { data } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            if (data.target_commitish !== expected) {
              core.setFailed(`release ${tag} now points at ${data.target_commitish}, not the deployed sha ${expected} -- another draft update raced with this publish. Not promoting.`);
            }

      - name: Promote release to latest
        if: ${{ needs.pin-draft.result == 'success' }}
        uses: ./.github/actions/promote-release-to-latest
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag-prefix }}${{ inputs.version }}

      - name: Build rollout status
        id: status
        shell: bash
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          REGION: ${{ inputs.region }}
        run: |
          status="failed"
          if [ "$DEPLOY_RESULT" = "success" ]; then
            status="complete"
          fi
          regions_status=$(jq -cn --arg region "$REGION" --arg status "$status" '[{region: $region, status: $status}]')
          echo "regions-status=${regions_status}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/update-region-rollout-status
        with:
          tag: ${{ inputs.tag-prefix }}${{ inputs.version }}
          regions-status: ${{ steps.status.outputs.regions-status }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for a newer tag already published
        if: ${{ needs.pin-draft.result == 'success' }}
        id: check-newer
        uses: actions/github-script@v7
        env:
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          CURRENT_VERSION: ${{ inputs.version }}
        with:
          script: |
            const prefix = process.env.TAG_PREFIX;
            const current = process.env.CURRENT_VERSION;
            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${prefix}`,
              per_page: 100,
            });
            const versions = refs
              .map((r) => r.ref.replace(/^refs\/tags\//, "").slice(prefix.length))
              .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            const idx = versions.indexOf(current);
            const newer = idx !== -1 && idx < versions.length - 1 ? versions[versions.length - 1] : "";
            core.setOutput("value", newer);

  redraft-if-newer:
    needs: [finalize]
    if: ${{ !cancelled() && needs.finalize.outputs.newer-version != '' }}
    uses: ./.github/workflows/release-draft.yml
    with:
      version: ${{ inputs.tag-prefix }}${{ needs.finalize.outputs.newer-version }}
