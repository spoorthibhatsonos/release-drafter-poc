# Test-only config. Points _extends at an arbitrary existing file in a
# private Sonos-Inc repo (platform-core) purely to observe whether the
# cross-repo fetch itself succeeds — the fetched content (a markdown
# README) is NOT expected to be a valid release-drafter config, so a
# YAML/schema error AFTER a successful fetch is the expected "it worked"
# signal, distinct from a 404/403 auth error before any parsing happens.
_extends: Sonos-Inc/platform-core:/README.md@main
