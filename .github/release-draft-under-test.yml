# Exact copy of platform-core's canonical workflows/release-draft/release-drafter.yml,
# for testing workflow.yml's "Update draft release" step end-to-end. Not fetched via
# _extends here -- _extends itself was already verified separately earlier. This test is
# about the workflow's own input-wiring (version/tag/commitish) against the real config.
name-template: "$RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    labels: ["feature", "enhancement"]
    exclusive: true
  - title: "🐛 Bug Fixes"
    labels: ["bug", "fix"]
    exclusive: true
  - title: "🧰 Maintenance"
    labels: ["maintenance", "chore"]
    exclusive: true
  - title: "📦 Dependencies"
    labels: ["dependencies"]
    exclusive: true

change-template: "- $TITLE (#$NUMBER, @$AUTHOR)"
commitish: "main"

template: |
  ## Changes since $PREVIOUS_TAG

  $CHANGES
